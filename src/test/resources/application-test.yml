spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/resume_analyzer_test
    username: resumeuser
    password: resumepassword
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

logging:
  level:
    root: WARN
    com.srikanth.ai.resumeanalyzer: DEBUG

