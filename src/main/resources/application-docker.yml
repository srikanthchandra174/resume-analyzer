spring:
  application:
    name: resume-analyzer

  # Server Configuration
  server:
    port: 8080

  # Database Configuration for Docker
  datasource:
    url: jdbc:postgresql://postgres:5432/resume_analyzer
    username: resumeuser
    password: resumepassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration for Docker
  data:
    redis:
      host: redis
      port: 6379
      password:

  # Cache Configuration
  cache:
    type: redis

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4-turbo-preview
          temperature: 0.7

# Logging
logging:
  level:
    root: INFO
    com.srikanth.ai.resumeanalyzer: INFO

