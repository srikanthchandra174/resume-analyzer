spring:
  application:
    name: resume-analyzer

  # Database Configuration (PostgreSQL)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_analyzer}
    username: ${DB_USERNAME:resumeuser}
    password: ${DB_PASSWORD:resumepassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
    open-in-view: false

  # Redis Configuration (only used when app.cache.enabled=true)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  # Analysis results are cached manually by CacheService, not via @Cacheable
  cache:
    type: none

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Spring AI Configuration
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.7
          top-p: 0.9
          max-tokens: 1024

  # Jackson Configuration (Boot 4 / Jackson 3 writes dates as ISO-8601 strings by default)
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

# Application Configuration
app:
  cache:
    enabled: ${CACHE_ENABLED:false}

# Logging Configuration
logging:
  level:
    root: INFO
    com.srikanth.ai.resumeanalyzer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/resume-analyzer.log

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
